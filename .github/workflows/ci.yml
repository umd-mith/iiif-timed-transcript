name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version is pinned via the "packageManager" field in package.json;
      # omitting `version` here makes action-setup read that single source of truth.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm exec svelte-kit sync
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm run test:a11y-docs
      - run: pnpm build
      - run: pnpm --filter iiif-timed-transcript-docs run build
      - run: pnpm run smoke:docs
