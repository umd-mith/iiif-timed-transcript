name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing (no stored token)
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1, required for OIDC trusted publishing.
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Skip when this version is already on npm — the one-time bootstrap release
      # (0.16.0) is published manually to create the package before OIDC can be
      # configured, so its tag would otherwise fail on a duplicate version. Also
      # makes any tag re-run idempotent.
      - id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # `prepublishOnly` (pnpm run build) runs during `npm publish`, refreshing dist
      # before packing; provenance attaches to that fresh build.
      - if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public
