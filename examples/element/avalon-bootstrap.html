<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>iiif-transcript-player — Avalon-style Bootstrap page</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      iiif-transcript-player {
        display: block;
        min-height: 24rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <span class="navbar-brand">Avalon-ish</span>
    </nav>
    <main class="container py-4">
      <div class="row">
        <div class="col-lg-8">
          <!-- Public Avalon item: Choice-wrapped HLS renditions (survey item 5425kb370) -->
          <iiif-transcript-player
            id="avalon"
            manifest-url="https://av.lib.umd.edu/media_objects/5425kb370/manifest.json"
          ></iiif-transcript-player>
        </div>
        <aside class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <h2 class="h5">Sidebar</h2>
              <p class="small text-muted">
                Bootstrap's button/input resets must not reach the player; the
                player's styles must not reach this card.
              </p>
              <button class="btn btn-primary">Host button</button>
              <pre id="log" class="mt-3 small"></pre>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <script src="../../dist/element/iiif-transcript-player.iife.js"></script>
    <script>
      const log = document.getElementById("log");
      const el = document.getElementById("avalon");
      el.addEventListener(
        "playerrefavailable",
        (e) =>
          (log.textContent += `ready: ${e.detail.playerRef.mediaType}, canvases=${e.detail.playerRef.canvasCount}\n`),
      );
      el.addEventListener(
        "playererror",
        (e) =>
          (log.textContent += `error: fatal=${e.detail.fatal} source=${e.detail.source} ${e.detail.error.message}\n`),
      );
    </script>
  </body>
</html>
