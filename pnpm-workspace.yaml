packages:
  - "."
  - "docs"
# Approve native build scripts so `pnpm install` does not exit non-zero.
# `allowBuilds` is the mechanism honored by pnpm 11.x (CI runs
# pnpm/action-setup with version: latest); `onlyBuiltDependencies` is kept
# for compatibility with older pnpm, which ignores `allowBuilds`.
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
